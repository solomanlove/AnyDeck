[package]
name = "anydeck_device_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["airplay-uxplay"]
airplay-uxplay = []

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
plist = "1.6"
rand = "0.8"
base64 = "0.22"
httparse = "1.9"
sha2 = "0.10"


